<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>لیست محتوا</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            flex: 1;
        }

        .card-content h3 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .card-content p {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
        }

        .card a {
            display: block;
            text-align: center;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            transition: background-color 0.3s;
        }

        .card a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">
        <img src="https://via.placeholder.com/400x300" alt="عکس">
        <div class="card-content">
            <h3>عنوان اول</h3>
            <p>این یک خلاصه کوتاه از محتوای مورد نظر است که توضیح مختصری می‌دهد.</p>
        </div>
        <a href="https://00">تماشای کامل</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400x300" alt="عکس">
        <div class="card-content">
            <h3>عنوان دوم</h3>
            <p>در این بخش می‌توانید توضیح کوتاهی درباره این آیتم قرار دهید.</p>
        </div>
        <a href="https://00">تماشای کامل</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400x300" alt="عکس">
        <div class="card-content">
            <h3>عنوان سوم</h3>
            <p>خلاصه‌ای کوتاه برای جذب کاربر و هدایت به صفحه کامل.</p>
        </div>
        <a href="https://00">تماشای کامل</a>
    </div>

</div>

</body>
</html>
